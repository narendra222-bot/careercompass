# CareerCompass learning catalog.
#
# Every course, link, hour estimate and coverage number here is hand-curated so the
# planner never invents resources. The LLM may only explain items from this file.
#
# Fields
#   id        unique slug
#   kind      course | project
#   roles     role profiles (role_profiles.yaml keys) this item serves
#   hours     estimated effort for a beginner (editorial)
#   prereqs   ids that must come first (the catalog must be a DAG)
#   resources free / open-access links
#   covers.tech      curated technology name -> mastery gained (0..1)
#   covers.elements  O*NET skill/knowledge name -> fraction of the required level gained
#   deliverables     (projects) concrete proof-of-work outputs
#
# All numbers: editorial, human_reviewed: false.

meta:
  version: 1
  human_reviewed: false

items:
  # ---------------- foundations ----------------
  - id: linux-fundamentals
    title: Linux command line fundamentals
    kind: course
    roles: [devops engineer, cloud engineer, site reliability engineer, machine learning engineer]
    hours: 25
    prereqs: []
    resources:
      - title: Linux Journey
        url: https://linuxjourney.com/
      - title: The Linux Command Line (William Shotts, free book)
        url: https://linuxcommand.org/tlcl.php
    covers:
      tech: {Linux: 0.6, Bash: 0.2}
      elements: {Computers and Electronics: 0.15, Operations Monitoring: 0.1}

  - id: bash-scripting
    title: Shell scripting and automation
    kind: course
    roles: [devops engineer, cloud engineer, site reliability engineer]
    hours: 15
    prereqs: [linux-fundamentals]
    resources:
